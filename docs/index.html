<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人导航 | My Hub</title>

    <link rel="icon" type="image/svg+xml" href="https://q.qlogo.cn/headimg_dl?dst_uin=1306360483&spec=640">
    
    <!-- 字体与图标库 -->
   
    <!-- 1. 引用本地字体 CSS -->
    <link rel="stylesheet" href="fonts/inter.css">

    <!-- 2. 引用本地图标 JS -->
    <script src="js/lucide.min.js"></script>

    <style>
        :root {
            --accent-color: #4a90e2;
            --text-main: #2d3436;
            --text-sub: #88929b; /* 调轻了副文本颜色 */
            --glass: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.4);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* 核心布局 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, "PingFang SC", sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }

        /* 动态流动背景 */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, #f8f9fa, #e9ecef, #f1f3f5, #e7f5ff);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 头部区域 */
        header {
            width: 100%;
            max-width: 900px;
            padding: 60px 20px 40px;
            text-align: center;
            animation: fadeInDown 0.8s ease;
        }

        #clock {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .date-box { margin-bottom: 30px; }
        .date-cn { font-size: 1.1rem; color: var(--text-main); }
        .date-en { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }

        .profile { margin-top: 25px; }
        .avatar {
            width: 85px; height: 85px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }
        .avatar:hover { transform: scale(1.1) rotate(5deg); }
        .profile h1 { font-size: 1.5rem; font-weight: 600; }
        .profile p { color: var(--text-sub); font-size: 0.9rem; max-width: 450px; margin: 5px auto; }

        /* 主体区域 */
        main {
            flex: 1; /* 自动撑开 */
            width: 100%;
            max-width: 1000px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 搜索框 */
        .search-container {
            width: 100%;
            max-width: 550px;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease 0.2s backwards;
        }
        .search-bar {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 6px 6px 6px 20px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1rem;
            color: var(--text-main);
        }
        .search-btns { display: flex; gap: 4px; }
        .search-btns button {
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.04);
            color: var(--text-sub);
            transition: 0.3s;
        }
        .search-btns button:hover { background: var(--accent-color); color: white; }

        /* 导航网格 */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease 0.4s backwards;
        }
        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #fff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }
        .icon-box {
            width: 50px; height: 50px;
            background: #fff;
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 20px;
            color: var(--accent-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .card-content h3 { font-size: 1.05rem; margin-bottom: 4px; }
        .card-content p { font-size: 0.85rem; color: var(--text-sub); }

        /* 极简底部样式 - 优化后的部分 */
        footer {
            width: 100%;
            padding: 25px 20px; /* 减小了内边距 */
            font-size: 0.75rem; /* 减小了字号 */
            color: var(--text-sub);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; /* 手机端自动换行 */
            gap: 10px;
            opacity: 0.8;
        }
        footer .dot { opacity: 0.3; padding: 0 5px; }
        footer a { color: var(--text-sub); text-decoration: none; transition: 0.3s; }
        footer a:hover { color: var(--accent-color); }
        .footer-item { display: flex; align-items: center; gap: 4px; }

        /* 入场动画 */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 移动端适配 */
        @media (max-width: 600px) {
            #clock { font-size: 2.8rem; }
            .nav-grid { grid-template-columns: 1fr; }
            footer { flex-direction: column; gap: 5px; } /* 手机端改为垂直排列 */
            footer .dot { display: none; } /* 手机端隐藏圆点 */
        }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <header>
        <div id="clock">00:00:00</div>
        <div class="date-box">
            <div id="date-cn" class="date-cn">加载中...</div>
            <div id="date-en" class="date-en">Loading...</div>
        </div>

        <div class="profile">
            <img src="https://q.qlogo.cn/headimg_dl?dst_uin=1306360483&spec=640" alt="Avatar" class="avatar">
            <h1>蓝色peach</h1>
            <p>奈何桥下，回溯这人世间.你还记得那个人吗？</p>
        </div>
    </header>

    <main>
        <!-- 搜索区域 -->
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="输入关键字搜索..." onkeydown="if(event.keyCode==13) search('bing')">
                <div class="search-btns">
                   <!-- <button onclick="search('google')">Google</button> -->
                    <button onclick="search('bing')">Bing</button>
                </div>
            </div>
        </div>

        <!-- 导航区域 -->
        <div class="nav-grid">
            <a href="https://blog.lansepeach.cn/" class="card">
                <div class="icon-box"><i data-lucide="book-open"></i></div>
                <div class="card-content">
                    <h3>个人博客</h3>
                    <p>分享技术文章与生活随笔</p>
                </div>
            </a>
            <a href="https://jk.lansepeach.cn/" class="card">
                <div class="icon-box"><i data-lucide="activity"></i></div>
                <div class="card-content">
                    <h3>服务监控</h3>
                    <p>实时查看服务器运行状态</p>
                </div>
            </a>
            <a href="http://cloud.lansepeach.cn:5212/" class="card">
                <div class="icon-box"><i data-lucide="hard-drive"></i></div>
                <div class="card-content">
                    <h3>私有云盘</h3>
                    <p>基于云端安全存储个人文件</p>
                </div>
            </a>
            <a href="https://mc.lansepeach.cn/" class="card">
                <div class="icon-box"><i data-lucide="Gamepad"></i></div>
                <div class="card-content">
                    <h3>我的世界服务器</h3>
                    <p>欢迎来到我们的世界</p>
                </div>
            </a>
            <a href="https://ai.lansepeach.cn/" class="card">
                <div class="icon-box"><i data-lucide="Bot"></i></div>
                <div class="card-content">
                    <h3>ai项目实验室</h3>
                    <p>正在孵化中的有趣 Demo</p>
                </div>
            </a>
            <a href="https://jq.qq.com/?_wv=1027&k=5LHiiU6" class="card">
                <div class="icon-box"><i data-lucide="mail"></i></div>
                <div class="card-content">
                    <h3>加入交流群</h3>
                    <p>如有合作意向欢迎随时联系</p>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-item">&copy; 2020 - <span id="year"></span>蓝色peach</div>
        <span class="dot">•</span>
        <div class="footer-item">
            <a href="https://beian.miit.gov.cn/" target="_blank">皖ICP备17006084号-2</a>
        </div>
        <span class="dot">•</span>
        <div class="footer-item">Powered by Gemini AI</div>
    </footer>

    <script>
        lucide.createIcons();

        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
            const cnOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date-cn').innerText = now.toLocaleDateString('zh-CN', cnOptions);
            const enOptions = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
            document.getElementById('date-en').innerText = now.toLocaleDateString('en-US', enOptions);
            document.getElementById('year').innerText = now.getFullYear();
        }

        function search(engine) {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            const url = engine === 'google' 
                ? `https://www.google.com/search?q=${encodeURIComponent(query)}`
                : `https://cn.bing.com/search?q=${encodeURIComponent(query)}`;
            window.open(url, '_blank');
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
