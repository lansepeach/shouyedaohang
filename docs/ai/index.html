<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蓝色 Peach · AI 工具集</title>
    <meta name="description" content="蓝色 Peach 整理的 AI 工具入口：国内免费大模型节点、Gemini ChatGPT-Next-Web、个人博客。">
    <meta name="theme-color" content="#F0EEE6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1917" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="蓝色 Peach · AI 工具集">
    <meta property="og:description" content="整理一些自建和好用的 AI 入口，免费、无门槛、随时可用。">
    <meta property="og:type" content="website">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C96442'/%3E%3Cpath d='M16 7v18M7 16h18M9.5 9.5l13 13M22.5 9.5l-13 13' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">

    <noscript>
        <style>
            h1, .lede, .card, .section-label, .footer {
                opacity: 1 !important;
                animation: none !important;
                transform: none !important;
            }
        </style>
    </noscript>

    <style>
        :root {
            --bg:        #F0EEE6;
            --surface:   rgba(250, 249, 245, 0.82);
            --surface-strong: #FAF9F5;
            --border:    #E5E1D6;
            --border-strong: #D6D1C2;
            --ink:       #1F1E1D;
            --ink-muted: #5C5B58;
            --ink-soft:  #84827C;
            --accent:    #C96442;
            --accent-2:  #E08767;
            --accent-rgb: 201, 100, 66;
            --grid-line: rgba(31, 30, 29, 0.05);
            --status:    #3FAE6B;
            --shadow:    rgba(31, 30, 29, 0.10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg:        #1A1917;
                --surface:   rgba(38, 37, 34, 0.78);
                --surface-strong: #262522;
                --border:    #34322E;
                --border-strong: #44423D;
                --ink:       #F4F2EC;
                --ink-muted: #B5B2AA;
                --ink-soft:  #84827C;
                --accent:    #E08767;
                --accent-2:  #F0A081;
                --accent-rgb: 224, 135, 103;
                --grid-line: rgba(244, 242, 236, 0.04);
                --status:    #5DD18A;
                --shadow:    rgba(0, 0, 0, 0.28);
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                         "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: -1px -1px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            z-index: 9;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(var(--accent-rgb), 0.55),
                transparent
            );
            opacity: 0.75;
            pointer-events: none;
        }

        .aurora {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            contain: strict;
        }

        .aurora::before,
        .aurora::after {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            will-change: transform;
        }

        .aurora::before {
            top: -180px;
            right: -120px;
            background: radial-gradient(circle, rgba(var(--accent-rgb), .35), transparent 65%);
            animation: drift1 22s ease-in-out infinite;
        }

        .aurora::after {
            bottom: -200px;
            left: -160px;
            background: radial-gradient(circle, rgba(var(--accent-rgb), .22), transparent 65%);
            animation: drift2 28s ease-in-out infinite;
        }

        @keyframes drift1 {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(-40px, 30px);
            }
        }

        @keyframes drift2 {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(50px, -25px);
            }
        }

        a {
            color: inherit;
        }

        .page {
            flex: 1;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 72px 24px 48px;
            position: relative;
            z-index: 1;
        }

        /* ----- 顶部 ----- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 80px;
            animation: topbar-in .7s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes topbar-in {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--ink-muted);
        }

        .brand-mark {
            position: relative;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: grid;
            place-items: center;
            box-shadow:
                0 1px 2px rgba(0,0,0,.08),
                inset 0 1px 0 rgba(255,255,255,.20);
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 10px;
            background: radial-gradient(circle, rgba(var(--accent-rgb), .45), transparent 70%);
            opacity: 0;
            z-index: -1;
            animation: breathe 3.6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.25;
                transform: scale(0.95);
            }
            50% {
                opacity: 0.65;
                transform: scale(1.08);
            }
        }

        .brand-mark svg {
            display: block;
            position: relative;
            z-index: 1;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            padding: 5px 9px;
            border: 1px solid rgba(var(--accent-rgb), 0.13);
            border-radius: 999px;
            background: rgba(var(--accent-rgb), 0.045);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .dot {
            position: relative;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--status);
            box-shadow: 0 0 0 0 rgba(63, 174, 107, .55);
            animation: pulse 2.4s cubic-bezier(.4, 0, .6, 1) infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(63, 174, 107, .55);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(63, 174, 107, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(63, 174, 107, 0);
            }
        }

        /* ----- 标题 + 介绍 ----- */
        h1 {
            font-family: "Times New Roman", "Songti SC", "Source Han Serif SC",
                         "Noto Serif CJK SC", "STSong", serif;
            font-weight: 500;
            font-size: clamp(2rem, 5.2vw, 2.875rem);
            line-height: 1.12;
            letter-spacing: -0.02em;
            margin: 0 0 18px;
            color: var(--ink);
            opacity: 0;
            animation: fallback-reveal 0.4s ease-out 1.6s forwards;
        }

        h1 .accent {
            font-style: italic;
            background: linear-gradient(
                100deg,
                var(--accent) 0%,
                var(--accent-2) 30%,
                var(--accent) 60%,
                var(--accent-2) 100%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 7s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        h1 .accent.tok-block {
            animation:
                shimmer 7s linear infinite,
                accent-reveal 0.55s cubic-bezier(.2, .7, .2, 1) var(--block-delay, 0ms) both;
        }

        @keyframes accent-reveal {
            0% {
                opacity: 0;
                filter: blur(8px);
                letter-spacing: 0.04em;
            }
            60% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                filter: blur(0);
                letter-spacing: -0.02em;
            }
        }

        .lede {
            font-size: 1.0625rem;
            color: var(--ink-muted);
            margin: 0 0 46px;
            max-width: 56ch;
            opacity: 0;
            animation: fallback-reveal 0.4s ease-out 1.6s forwards;
        }

        @keyframes fallback-reveal {
            to {
                opacity: 1;
            }
        }

        /* ----- 流式生成：每个字符 ----- */
        .tok {
            opacity: 0;
            animation: tok-in 0.42s cubic-bezier(.2, .7, .2, 1) both;
        }

        @keyframes tok-in {
            0% {
                opacity: 0;
                text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.55);
            }
            55% {
                opacity: 1;
                text-shadow: 0 0 5px rgba(var(--accent-rgb), 0.30);
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 0 rgba(var(--accent-rgb), 0);
            }
        }

        /* 闪烁光标 */
        .cursor {
            display: inline-block;
            width: 0.5em;
            height: 1.05em;
            vertical-align: -3px;
            margin-left: 5px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            border-radius: 1px;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .lede .cursor {
            height: 0.95em;
            vertical-align: -2px;
        }

        .cursor.on {
            animation: blink 1.05s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ----- 分组 ----- */
        .section-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 0 0 18px;
            opacity: 0;
            transform: translateY(6px);
            animation: label-in .55s cubic-bezier(.2,.8,.2,1) forwards;
        }

        .section-label:nth-of-type(1) {
            animation-delay: .48s;
        }

        .section-label:nth-of-type(2) {
            animation-delay: .78s;
        }

        @keyframes label-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-label::before {
            content: "";
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), .6);
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        /* ----- 卡片栅格 ----- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 48px;
        }

        .card {
            display: block;
            padding: 22px 24px;
            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.16),
                    rgba(255,255,255,0)
                ),
                var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--ink);
            position: relative;
            overflow: hidden;
            transition:
                border-color .2s ease,
                transform .2s ease,
                box-shadow .2s ease,
                background-color .2s ease;
            opacity: 0;
            animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 1px 0 rgba(255,255,255,.15) inset,
                0 10px 30px -24px var(--shadow);
        }

        /* 关键：卡片变快，不等上方打字完成 */
        .grid > .card:nth-child(1) {
            animation-delay: .62s;
        }

        .grid > .card:nth-child(2) {
            animation-delay: .76s;
        }

        .grid > .card:nth-child(3) {
            animation-delay: .90s;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                260px circle at var(--mx, -200px) var(--my, -200px),
                rgba(var(--accent-rgb), .16),
                transparent 52%
            );
            opacity: 0;
            transition: opacity .25s ease;
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(var(--accent-rgb), .38),
                transparent 35%,
                transparent 65%,
                rgba(var(--accent-rgb), .14)
            );
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity .25s ease;
            pointer-events: none;
        }

        .card:hover::before,
        .card:hover::after {
            opacity: 1;
        }

        .card:hover {
            border-color: var(--border-strong);
            transform: translateY(-3px);
            box-shadow:
                0 1px 0 rgba(255,255,255,.20) inset,
                0 16px 36px -18px var(--shadow);
        }

        .card:active {
            transform: translateY(-1px) scale(.995);
        }

        .card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 6px;
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.005em;
        }

        .arrow {
            color: var(--ink-soft);
            transition: transform .25s ease, color .25s ease;
            flex-shrink: 0;
        }

        .card:hover .arrow {
            color: var(--accent);
            transform: translate(2px, -2px);
        }

        .card-desc {
            font-size: 13.5px;
            color: var(--ink-muted);
            margin: 0;
            line-height: 1.55;
            position: relative;
            z-index: 1;
        }

        .card-tag {
            display: inline-block;
            margin-top: 12px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--accent);
            background: rgba(var(--accent-rgb), .10);
            padding: 3px 8px;
            border-radius: 999px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(var(--accent-rgb), .12);
        }

        /* ----- 页脚 ----- */
        .footer {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 24px;
            font-size: 12.5px;
            color: var(--ink-soft);
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: footer-in .6s ease-out 1s forwards;
        }

        @keyframes footer-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer a {
            color: var(--ink-muted);
            text-decoration: none;
            transition: color .2s ease;
        }

        .footer a:hover {
            color: var(--accent);
        }

        ::selection {
            background: rgba(var(--accent-rgb), .25);
            color: var(--ink);
        }

        @media (max-width: 600px) {
            .page {
                padding: 48px 20px 32px;
            }

            .topbar {
                margin-bottom: 56px;
            }

            .lede {
                margin-bottom: 40px;
                font-size: 1rem;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 40px;
            }

            .card {
                padding: 20px 20px;
                border-radius: 15px;
            }

            .footer {
                padding: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            h1,
            .lede,
            .card,
            .section-label,
            .footer {
                opacity: 1 !important;
                transform: none !important;
            }

            .tok {
                opacity: 1 !important;
            }
        }
    </style>
</head>

<body>

                    </svg>

        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">皖ICP备17006084号-2</a>
    </footer>

    <script>
        // 卡片鼠标 spotlight ─ 只更新 CSS 变量，零 layout
        (function () {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            document.querySelectorAll('.card').forEach(function (card) {
                card.addEventListener('pointermove', function (e) {
                    var r = card.getBoundingClientRect();
                    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
                    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
                }, { passive: true });

                card.addEventListener('pointerleave', function () {
                    card.style.removeProperty('--mx');
                    card.style.removeProperty('--my');
                }, { passive: true });
            });
        })();

        // AI 流式生成：将标题与介绍按字符切片，错峰播放一次性 keyframe
        (function () {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            var h1 = document.querySelector('h1');
            var lede = document.querySelector('.lede');

            if (!h1 || !lede) return;

            function tokenize(el, startMs, perChar) {
                var t = startMs;
                var collected = [];
                var nodes = Array.prototype.slice.call(el.childNodes);

                for (var i = 0; i < nodes.length; i++) {
                    var node = nodes[i];

                    if (node.nodeType === 3) {
                        var text = node.nodeValue;

                        for (var j = 0; j < text.length; j++) {
                            var ch = text[j];

                            if (ch === '\n') {
                                continue;
                            }

                            var s = document.createElement('span');
                            s.className = 'tok';
                            s.textContent = ch;

                            if (ch !== ' ') {
                                var jitter = (Math.random() - 0.5) * 0.45 * perChar;
                                t += perChar + jitter;

                                // 偶发 token 思考停顿，稍微调低概率，整体更快
                                if (Math.random() < 0.045) {
                                    t += 80;
                                }
                            } else {
                                t += perChar * 0.4;
                            }

                            s.style.animationDelay = Math.round(t) + 'ms';
                            collected.push(s);
                        }
                    } else if (node.nodeType === 1) {
                        // 元素节点：<br> 直接保留；其他如 .accent 作为整体块揭示
                        if (node.tagName === 'BR') {
                            collected.push(node);
                        } else {
                            var len = (node.textContent || '').length;

                            t += perChar * 1.2;
                            node.classList.add('tok-block');
                            node.style.setProperty('--block-delay', Math.round(t) + 'ms');

                            t += perChar * Math.max(len, 1);
                            collected.push(node);
                        }
                    }
                }

                el.textContent = '';

                for (var k = 0; k < collected.length; k++) {
                    el.appendChild(collected[k]);
                }

                return t;
            }

            try {
                var t = 180;

                // 标题稍微快一点
                t = tokenize(h1, t, 48);
                var titleEnd = t;

                // 介绍也稍微快一点
                t = tokenize(lede, t + 180, 18);
                var ledeEnd = t;

                // 立即把容器显出来；字符各自的 opacity 动画接管视觉
                h1.style.opacity = '1';
                h1.style.animation = 'none';

                lede.style.opacity = '1';
                lede.style.animation = 'none';

                // 流式结束后：光标淡入 → 闪烁 → 淡出
                var cursor = document.createElement('span');
                cursor.className = 'cursor';
                lede.appendChild(cursor);

                setTimeout(function () {
                    cursor.style.opacity = '1';
                    cursor.classList.add('on');
                }, ledeEnd + 80);

                setTimeout(function () {
                    cursor.style.opacity = '0';
                }, ledeEnd + 2200);

                setTimeout(function () {
                    cursor.remove();
                }, ledeEnd + 2800);

                // 关键修改：
                // 卡片不再等待上方文字全部打完，而是页面打开后快速显示。
                var cards = document.querySelectorAll('.card');

                for (var i = 0; i < cards.length; i++) {
                    cards[i].style.animationDelay = (300 + i * 90) + 'ms';
                }
            } catch (e) {
                h1.style.opacity = '1';
                h1.style.animation = 'none';

                lede.style.opacity = '1';
                lede.style.animation = 'none';

                document.querySelectorAll('.card').forEach(function (card) {
                    card.style.opacity = '1';
                    card.style.animation = 'none';
                });
            }
        })();
    </script>
</body>
</html>
